name: Build and deploy GitHub Pages
on:
  push:
    branches: [production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Get Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build website and Studio for the Pages subdirectory
        run: npm run build
        env:
          SANITY_STUDIO_BASEPATH: ${{ steps.pages.outputs.base_path }}/studio
      - name: Check project-path rendering
        run: |
          npx playwright install --with-deps chromium
          node --test tests/pages.test.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
